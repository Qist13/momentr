[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "momentr"
version = "0.1.0"
description = "Instant-replay screen clipper for Linux: press a hotkey to save the last N seconds."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pynput>=1.7",
    "pystray>=0.19",
    "Pillow>=9",
]

[project.scripts]
momentr = "momentr.__main__:main"

[tool.setuptools]
packages = ["momentr"]
